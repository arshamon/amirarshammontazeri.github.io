<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Amirarsham Montazeri</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="shell" id="shell">
  <main>
    <div class="content">

      <section class="section" id="blogIndex">
        <h1>Blog</h1>
        <p>Notes and writing, added over time.</p>
        <div id="postList"></div>
      </section>

      <section class="section" id="blogPost" style="display:none;">
        <a href="blog.html">&larr; Back to all posts</a>
        <h1 id="postTitle" style="margin-top:1rem;"></h1>
        <div class="post-date" id="postDate"></div>
        <div id="postBody"></div>
      </section>

    </div>
  </main>
</div>

<script src="assets/content.js"></script>
<script src="assets/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  const slug = params.get("post");

  if (slug !== null && SITE.posts[slug]) {
    document.getElementById("blogIndex").style.display = "none";
    document.getElementById("blogPost").style.display = "block";
    const post = SITE.posts[slug];
    document.getElementById("postTitle").textContent = post.title;
    document.getElementById("postDate").textContent = post.date;
    document.getElementById("postBody").innerHTML = post.body;
    document.title = post.title + " — " + SITE.name;
    return;
  }

  const list = document.getElementById("postList");
  if (SITE.posts.length) {
    list.innerHTML = SITE.posts.map((p, i) => `
      <div class="post-summary">
        <div class="post-date">${p.date}</div>
        <h3><a href="blog.html?post=${i}">${p.title}</a></h3>
        <p>${p.summary}</p>
      </div>
    `).join("");
  } else {
    list.innerHTML = emptyState("No posts yet — check back soon.");
  }
});
</script>
</body>
</html>
