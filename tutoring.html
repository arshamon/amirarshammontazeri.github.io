<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutoring — Amirarsham Montazeri</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="shell" id="shell">
  <main>
    <div class="content">

      <section class="section">
        <h1>Tutoring</h1>
        <p id="tutorIntro"></p>
      </section>

      <section class="section">
        <h2>Subjects</h2>
        <div id="tutorList"></div>
      </section>

      <section class="section">
        <h2>Get in touch</h2>
        <p>Interested in a session? Reach out through the <a href="contact.html">contact page</a>.</p>
      </section>

    </div>
  </main>
</div>

<script src="assets/content.js"></script>
<script src="assets/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("tutorIntro").textContent = SITE.tutoringIntro;

  const list = document.getElementById("tutorList");
  list.innerHTML = SITE.tutoring.map(t => `
    <div class="entry">
      <h3>${t.subject}</h3>
      <div class="meta">${t.level}</div>
      ${t.detail ? `<p>${t.detail}</p>` : ""}
    </div>
  `).join("") || emptyState("Tutoring subjects coming soon.");
});
</script>
</body>
</html>
